name: Platform Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Validate exact version and approved branch ancestry
        env:
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
        run: node scripts/release/metadata.cjs
  qualification:
    permissions:
      contents: read
      actions: read
    needs: policy
    uses: ./.github/workflows/container-qualification.yml
  publish:
    needs: [policy, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Select qualified image artifacts
        id: images
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('node:assert/strict');
            const { selectReceipts } = require('./scripts/release/qualification-receipts.cjs');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100
            });
            for (const receipt of selectReceipts(artifacts, process.env)) {
              const name = receipt.artifact_name.replace(/^container-gates-/, 'container-');
              const matches = artifacts.filter(artifact => artifact.name === name);
              assert.equal(matches.length, 1, `MISSING_OR_AMBIGUOUS_IMAGE:${name}`);
              assert.equal(matches[0].expired, false, `EXPIRED_IMAGE:${name}`);
              core.info(`${receipt.architecture}: ${name} (ID ${matches[0].id})`);
              core.setOutput(receipt.architecture, String(matches[0].id));
            }
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.images.outputs.amd64 }}
          github-token: ${{ github.token }}
          path: release-input/amd64
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.images.outputs.arm64 }}
          github-token: ${{ github.token }}
          path: release-input/arm64
          merge-multiple: true
      - name: Install exact-image promotion tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish qualified OCI bytes and verify manifests
        run: node scripts/release/publish.cjs
      - name: Pull published version and smoke test
        env:
          TEST_ARCH: amd64
          SMOKE_ONLY: 'true'
        run: |
          export TEST_IMAGE="$DOCKERHUB_IMAGE:${GITHUB_REF_NAME#v}"
          docker pull "$TEST_IMAGE"
          node scripts/release/container-acceptance.cjs
      - name: Create checksummed release assets
        run: node scripts/release/release-assets.cjs
      - name: Create GitHub Release
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-output/release-notes.md "${prerelease[@]}" release-output/*.json release-output/compose.yaml release-output/container.env.example release-output/SHA256SUMS release-output/release-notes.md
      - name: Verify published release flags and assets
        run: |
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets > release-output/github-release.json
          node scripts/release/verify-github-release.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-verification-${{ github.run_id }}-${{ github.sha }}
          if-no-files-found: error
          path: release-output/
