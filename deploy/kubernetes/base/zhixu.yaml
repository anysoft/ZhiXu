apiVersion: v1
kind: Namespace
metadata:
  name: zhixu
---
apiVersion: v1
kind: Service
metadata:
  name: zhixu
  namespace: zhixu
  labels:
    app.kubernetes.io/name: zhixu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zhixu
  ports:
    - name: http
      port: 5700
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zhixu
  namespace: zhixu
  labels:
    app.kubernetes.io/name: zhixu
spec:
  serviceName: zhixu
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zhixu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhixu
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: zhixu
          image: anysoft/zhixu:1.0.0-rc.5
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /data/state
            - name: BACKUP_DIR
              value: /backup
            - name: HOME
              value: /data/home
            - name: TZ
              value: Asia/Singapore
          ports:
            - name: http
              containerPort: 5700
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backup
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
